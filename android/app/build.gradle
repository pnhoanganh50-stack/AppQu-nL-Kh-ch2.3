plugins {
    id "com.android.application"
    id "kotlin-android"
    // Plugin Flutter phải đứng sau 2 plugin Android và Kotlin.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "vn.quanlykhach.quan_ly_khach"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Bắt buộc cho thư viện thông báo (flutter_local_notifications)
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "vn.quanlykhach.quan_ly_khach"
        minSdk = 23
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            // Ký bằng chữ ký debug để cài được ngay (app dùng nội bộ, không đưa lên Play Store).
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    // Theme AppCompat cho màn hình vân tay trên Android cũ
    implementation "androidx.appcompat:appcompat:1.6.1"
}
